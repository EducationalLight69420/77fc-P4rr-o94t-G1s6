<html>
<head>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="setMap" width="500" height="250"></canvas>
  <script>
    const params = new URLSearchParams(window.location.search);
    const theme = eval(params.get('dark'));

    //const bg     = theme ? '#222222' : '#ffffff';
    const stroke = theme ? '#a8c4e0' : '#1B3A5C';
    const arrow  = theme ? '#f0b840' : '#C8860A';

    //document.body.style.background = bg;
    
    const canvas = document.getElementById("setMap");
    const ctx = canvas.getContext("2d");
    const width = 500;
    const height = 250;
    const radius = 100;
    let angle = Math.PI / 4;
    ctx.translate(width/2, height/2);

    ctx.beginPath();
    ctx.strokeStyle = stroke;
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    
    let x = Math.cos(angle) * radius;
    let y = Math.sin(angle) * radius;
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x, -y); // Invert y for canvas
    ctx.strokeStyle = stroke;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x, 0);
    ctx.strokeStyle = arrow;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, -y);
    ctx.strokeStyle = arrow;
    ctx.stroke();

    // Label X
    ctx.fillStyle = stroke;
    ctx.font = "bold italic 18px Georgia";
    //ctx.fillText("X", (width / 2) - 15, 15);

    // line function label;
    ctx.fillStyle = arrow;
    ctx.font = "bold italic 18px Georgia";
    ctx.fillText("cos", x/2, 20);
    ctx.fillText("sin", x - 18, -y/2-5);
  </script>
</body>
</html>
